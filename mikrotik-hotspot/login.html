<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Connect</title>
  <style>
    /*
      Served by the MikroTik itself, to a phone with no working internet. No
      fonts, no frameworks, no CDN — every byte comes off the router's flash.

      The whole purchase happens here now. It used to hand off to the web app
      to show packages and take a payment, which is another origin, another
      page load and another thing to go wrong for someone standing at a
      counter. Buying and reconnecting are the only two reasons anyone opens
      this page, so both are on it.
    */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0f172a 0%, #1e3a5f 55%, #0f172a 100%);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 1rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
      color: #fff;
    }

    .wrap { width: 100%; max-width: 26rem; margin: 0 auto; }

    /* ── Brand ─────────────────────────────────────────────── */
    .brand { text-align: center; margin-bottom: .875rem; }
    .brand-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2.5rem; height: 2.5rem; background: #2563eb;
      border-radius: .75rem; margin-bottom: .375rem;
      box-shadow: 0 .375rem 1.25rem rgba(37,99,235,.5);
    }
    .brand h1 { font-size: 1.0625rem; font-weight: 700; letter-spacing: -.02em; }
    .brand p { color: #94a3b8; font-size: .75rem; margin-top: .0625rem; }

    /* ── Reconnect card ────────────────────────────────────────
       Two thirds smaller than it was. It had a tab bar, a label, a
       two-row field, a two-line hint and a full-width button — most
       of a phone screen, above a page whose actual job is selling.
       Everyone who needs it already knows what it is for, so it is
       one row: paste, tap, done. */
    .reconnect {
      background: #fff; border-radius: .875rem; padding: .625rem;
      box-shadow: 0 .75rem 2rem rgba(0,0,0,.3);
    }
    .rc-row { display: flex; gap: .375rem; }
    .rc-row input {
      flex: 1; min-width: 0; border: 1.5px solid #d1d5db; border-radius: .5rem;
      padding: .5rem .625rem; font-size: .875rem; font-family: inherit;
      color: #111827; outline: none;
    }
    .rc-row input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.18); }
    .rc-row input::placeholder { color: #9ca3af; }
    .rc-row button {
      flex-shrink: 0; border: 0; border-radius: .5rem; background: #2563eb;
      color: #fff; font: inherit; font-size: .8125rem; font-weight: 700;
      padding: 0 .75rem; cursor: pointer;
    }
    .rc-row button:disabled { opacity: .55; cursor: default; }
    .rc-hint { font-size: .6875rem; color: #6b7280; margin-top: .3125rem; padding: 0 .125rem; }

    /* ── Messages ──────────────────────────────────────────── */
    .msg {
      display: none; border-radius: .5rem; padding: .5rem .625rem;
      font-size: .75rem; font-weight: 500; margin-top: .375rem;
    }
    .msg.show { display: block; }
    .msg.ok   { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .msg.bad  { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

    /* Waiting.

       Provisioning is a real conversation with the router — the customer
       cannot be logged in until it has heard of them — so this stands in
       front of the page and says which part is happening. It closes itself
       for anything that lasts: approving an M-Pesa prompt takes as long as
       it takes, and trapping somebody behind a spinner while they look for
       their phone helps nobody. */
    .wait {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(15,23,42,.72);
      align-items: center; justify-content: center; padding: 1.5rem;
    }
    .wait.show { display: flex; }
    .wait-card {
      background: #fff; border-radius: .875rem; padding: 1.5rem 1.75rem;
      text-align: center; max-width: 17rem; width: 100%;
      box-shadow: 0 1rem 2.5rem rgba(0,0,0,.35);
    }
    .wait-spin {
      width: 2.25rem; height: 2.25rem; margin: 0 auto .875rem;
      border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%;
      animation: wait-turn .7s linear infinite;
    }
    @keyframes wait-turn { to { transform: rotate(360deg); } }
    .wait-tick {
      display: none; width: 2.25rem; height: 2.25rem; margin: 0 auto .875rem;
      border-radius: 50%; background: #16a34a;
      align-items: center; justify-content: center;
      animation: wait-pop .28s ease-out;
    }
    @keyframes wait-pop { from { transform: scale(.5); opacity: 0; } }
    .wait.done .wait-spin { display: none; }
    .wait.done .wait-tick { display: flex; }
    .wait-text {
      font-size: .875rem; font-weight: 600; color: #1e293b; margin: 0;
      line-height: 1.45;
    }
    @media (prefers-reduced-motion: reduce) {
      .wait-spin { animation-duration: 2s; }
      .wait-tick { animation: none; }
    }

    .router-error {
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
      border-radius: .625rem; padding: .5rem .75rem; font-size: .75rem;
      margin-bottom: .625rem;
    }

    /* ── Packages ──────────────────────────────────────────── */
    .sec-label {
      font-size: .6875rem; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: #94a3b8;
      margin: 1.125rem 0 .5rem; padding-left: .125rem;
    }

    .pkg-list { display: flex; flex-direction: column; gap: .5rem; }

    .pkg {
      background: #fff; border-radius: .75rem; padding: .6875rem .75rem;
      box-shadow: 0 .25rem .75rem rgba(0,0,0,.18);
    }
    .pkg-main { display: flex; align-items: center; gap: .625rem; }
    .pkg-text { flex: 1; min-width: 0; }
    .pkg-name { font-size: .875rem; font-weight: 700; color: #111827; }
    .pkg-meta { font-size: .6875rem; color: #6b7280; margin-top: .0625rem; }
    .pkg-price {
      font-size: .9375rem; font-weight: 800; color: #1d4ed8;
      white-space: nowrap; text-align: right;
    }
    .pkg-buy {
      flex-shrink: 0; border: 0; border-radius: .5rem; background: #16a34a;
      color: #fff; font: inherit; font-size: .8125rem; font-weight: 700;
      padding: .4375rem .875rem; cursor: pointer;
    }
    .pkg-buy:disabled { opacity: .5; cursor: default; }

    /* The phone prompt, opened under the package it belongs to so there is
       never a question about which one is being bought. */
    .pkg-pay { display: none; margin-top: .625rem; padding-top: .625rem; border-top: 1px solid #f1f5f9; }
    .pkg.open .pkg-pay { display: block; }
    .pkg-pay label { display: block; font-size: .75rem; font-weight: 600; color: #374151; margin-bottom: .3125rem; }
    .pay-row { display: flex; gap: .375rem; }
    .pay-row input {
      flex: 1; min-width: 0; border: 1.5px solid #d1d5db; border-radius: .5rem;
      padding: .5rem .625rem; font-size: .9375rem; font-family: inherit;
      color: #111827; outline: none; letter-spacing: .02em;
    }
    .pay-row input:focus { border-color: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,.18); }
    .pay-row button {
      flex-shrink: 0; border: 0; border-radius: .5rem; background: #16a34a;
      color: #fff; font: inherit; font-size: .8125rem; font-weight: 700;
      padding: 0 .875rem; cursor: pointer;
    }
    .pay-row button:disabled { opacity: .55; cursor: default; }
    .pay-note { font-size: .6875rem; color: #6b7280; margin-top: .3125rem; }

    .pkg-status { display: none; margin-top: .5rem; font-size: .75rem; }
    .pkg-status.show { display: flex; align-items: center; gap: .375rem; }
    .pkg-status.waiting { color: #b45309; }
    .pkg-status.bad { color: #b91c1c; }
    .pkg-status.ok { color: #15803d; font-weight: 600; }

    .dot {
      width: .5rem; height: .5rem; border-radius: 50%; background: currentColor;
      flex-shrink: 0; animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 50% { opacity: .25; } }

    .empty {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: .75rem; padding: 1rem; text-align: center;
      color: #cbd5e1; font-size: .8125rem;
    }

    /* ── Support ───────────────────────────────────────────────
       Directly under the packages, because the person who needs it is
       looking at a price list they cannot get past. A phone on a
       captive portal has no internet and no other way to ask. */
    .support { margin-top: .875rem; }
    .support-label {
      font-size: .6875rem; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: #94a3b8;
      margin-bottom: .5rem; padding-left: .125rem;
    }
    .support-row { display: flex; gap: .5rem; }
    .support-row a {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: .375rem;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
      border-radius: .625rem; padding: .625rem .5rem;
      color: #dbeafe; font-size: .8125rem; font-weight: 600;
      text-decoration: none; min-width: 0;
    }
    .support-row a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .support-row a:active { background: rgba(255,255,255,.14); }

    /* Language, and the terms nobody had anywhere to put. */
    .lang {
      position: absolute; top: .75rem; right: .75rem;
      background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
      color: #dbeafe; border-radius: .5rem; padding: .3125rem .625rem;
      font: inherit; font-size: .6875rem; font-weight: 600; cursor: pointer;
    }
    .terms {
      text-align: center; font-size: .6875rem; color: #7c8ba1;
      margin-top: .875rem; line-height: 1.6;
    }
    .terms a { color: #60a5fa; text-decoration: underline; }

    /* ── Foot ──────────────────────────────────────────────── */
    .foot { text-align: center; color: #7c8ba1; font-size: .6875rem; margin-top: 1.125rem; line-height: 1.7; }
    .foot a { color: #60a5fa; text-decoration: none; }
    .foot .mac { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .625rem; color: #64748b; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
  <!-- Needed for CHAP, which RouterOS uses by default. See doLogin(). -->
  <script src="md5.js"></script>
</head>
<body>
<div class="wait" id="wait" role="status" aria-live="polite">
  <div class="wait-card">
    <div class="wait-spin"></div>
    <div class="wait-tick">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff"
           stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <p class="wait-text" id="waitText"></p>
  </div>
</div>

<button type="button" class="lang" id="langToggle">Kiswahili</button>

<!-- Settings live in config.js, which is the only file to edit. -->
<script src="config.js"></script>

<div class="wrap">

  <div class="brand">
    <div class="brand-icon">
      <svg width="20" height="20" fill="none" stroke="#fff" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="#fff" stroke="none"/>
      </svg>
    </div>
    <h1 id="provider">WiFi</h1>
    <p data-i18n="brand.tagline">Fast, reliable internet access</p>
  </div>

  <!-- MikroTik's own error, if it sent one -->
  $(if error)
  <div class="router-error">$(error)</div>
  $(endif)

  <!-- ── Already paid ── -->
  <div class="reconnect">
    <div class="rc-row">
      <input
        id="code"
        type="text"
        placeholder="Code or M-Pesa message"
        data-i18n-placeholder="code.placeholder"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        aria-label="Your access code or M-Pesa message"
      >
      <button type="button" id="connectBtn" data-i18n="code.connect">Connect</button>
    </div>
    <p class="rc-hint" data-i18n="code.hint">Already paid? Paste the whole M-Pesa message — we'll find it.</p>
    <div class="msg" id="rcMsg"></div>
  </div>

  <!-- ── Buy ── -->
  <p class="sec-label" data-i18n="packages.title">Buy a package</p>
  <div class="pkg-list" id="packages">
    <div class="empty" id="pkgEmpty" data-i18n="packages.loading">Loading packages…</div>
  </div>

  <!-- Filled once the operator's numbers arrive; hidden if they have none,
       rather than showing an empty "call us" with nothing to call. -->
  <div class="support" id="support" hidden>
    <p class="support-label" data-i18n="support.title">Need help?</p>
    <div class="support-row" id="supportRow"></div>
  </div>

  <!-- Hidden MikroTik login form, submitted once access is granted -->
  <form id="loginForm" action="$(link-login-only)" method="post" style="display:none">
    <input type="hidden" name="username" id="username" value="">
    <input type="hidden" name="password" id="password" value="">
    <input type="hidden" name="dst"      id="dst"      value="$(link-orig)">
    <input type="hidden" name="popup"    value="false">
  </form>

  <!-- $(mac) is plain text and safe to read as data rather than pasted into a
       script, which is where a page that builds JavaScript out of server-side
       substitution usually goes wrong. -->
  <div id="rt" data-mac="$(mac)" hidden></div>

  <!-- The CHAP values cannot be read the same way, and this is not a style
       choice.

       RouterOS substitutes $(chap-id) and $(chap-challenge) as *JavaScript
       string escapes* — the raw challenge bytes written as \NNN sequences,
       because its own stock login page uses them inside a quoted JS string.
       Nothing decodes escapes in an HTML attribute, so read from there they
       arrive as the literal characters backslash-N-N-N. The MD5 is then
       computed over the wrong input, and the router answers "invalid username
       or password" for a customer whose voucher was perfectly good.

       That is what happened: the account was created on the router, the
       username matched, /log showed "trying to log in by http-chap" followed
       immediately by a refusal, and the only wrong thing in the whole chain
       was where these two values were read from.

       Kept in its own script block deliberately. If a substitution ever does
       produce something that will not parse, the failure is contained here —
       the block below still runs, CHAP_ID stays undefined, and the guard in it
       falls back rather than taking the whole page down. -->
  <script>
    var RT_CHAP_ID        = '$(chap-id)';
    var RT_CHAP_CHALLENGE = '$(chap-challenge)';
  </script>

  <p class="terms" id="terms" hidden>
    <span data-i18n="terms.before">By connecting you agree to the </span><a
      id="termsLink" href="#" target="_blank" rel="noopener"
      data-i18n="terms.link">terms of service</a>.
  </p>

  <p class="foot">
    <span class="mac">$(mac)</span>
  </p>

</div>

<script>
(function () {
  var RT  = document.getElementById('rt');
  var MAC = RT.getAttribute('data-mac') || '';

  // From the block above, not from an attribute. typeof, because that block
  // is the one thing on this page that a bad substitution could stop from
  // running — and an undefined here must mean "no CHAP", not a crash.
  var CHAP_ID        = (typeof RT_CHAP_ID === 'string')        ? RT_CHAP_ID        : '';
  var CHAP_CHALLENGE = (typeof RT_CHAP_CHALLENGE === 'string') ? RT_CHAP_CHALLENGE : '';

  // A value RouterOS did not substitute arrives literally, e.g. "$(mac)".
  function substituted(v) { return v && v.charAt(0) !== '$'; }
  if (!substituted(MAC)) { MAC = ''; }
  if (!substituted(CHAP_ID)) { CHAP_ID = ''; }
  if (!substituted(CHAP_CHALLENGE)) { CHAP_CHALLENGE = ''; }

  // 5s, not 3s. The poll budget is 40/min and a purchase also spends requests
  // on packages, purchase and validate; at 3s a single customer outran the
  // limit inside a minute and started collecting 429s while their own payment
  // was landing. See awaitPayment's backoff for the other half of this.
  var POLL_MS = 5000;
  var GIVE_UP_MS = 3 * 60 * 1000;   // Safaricom prompts expire well inside this
  var pollTimer = null;
  var active = null;   // the purchase currently being waited on

  function el(id) { return document.getElementById(id); }

  function api(method, path, body, onOk, onFail) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, API_BASE + path, true);
    // Only on requests that carry one. Setting it on a GET makes the request
    // non-simple, so the browser preflights every poll -- two round trips
    // instead of one, on the slowest link the customer will ever use.
    if (body) { xhr.setRequestHeader('Content-Type', 'application/json'); }
    xhr.timeout = 15000;
    xhr.onload = function () {
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) { data = null; }
      if (xhr.status >= 200 && xhr.status < 300) { onOk(data); }
      else { onFail(data && data.detail, xhr.status); }
    };
    xhr.onerror = function () { onFail('No connection to the payment service.', 0); };
    xhr.ontimeout = function () { onFail('That took too long. Please try again.', 0); };
    xhr.send(body ? JSON.stringify(body) : null);
  }

  /* ── Getting online ─────────────────────────────────────────
     The backend has bound this MAC and created a hotspot user named
     after it with an empty password, so those are the credentials
     RouterOS is expecting.

     The password still has to be presented the way the server profile
     asks for it. RouterOS ships with login-by = cookie,http-chap, and
     under CHAP a plaintext password — empty or not — is simply
     rejected: the page appeared to work, the customer paid, and the
     router answered "invalid username or password". md5.js has been
     sitting in this folder for exactly this and nothing loaded it.

     $(chap-id) is empty when the profile uses http-pap, so this covers
     both without the operator configuring anything. */
  function logIn() {
    var password = '';
    if (CHAP_ID && CHAP_CHALLENGE && typeof MD5 === 'function') {
      password = MD5(CHAP_ID + password + CHAP_CHALLENGE);
    }
    el('username').value = MAC;
    el('password').value = password;
    el('loginForm').submit();
  }

  /* ── Waiting ────────────────────────────────────────────────
     Three states and nothing else: turning, succeeded, gone. */
  function waitShow(text) {
    var w = el('wait');
    w.className = 'wait show';
    el('waitText').textContent = text;
  }

  function waitSay(text) { el('waitText').textContent = text; }

  function waitHide() { el('wait').className = 'wait'; }

  /* Succeeded. Holds the tick long enough to be read, then hands over —
     usually to the router's login form, which replaces the page. */
  function waitDone(text, then) {
    var w = el('wait');
    w.className = 'wait show done';
    el('waitText').textContent = text;
    setTimeout(then, 700);
  }

  function say(node, text, kind) {
    node.textContent = text;
    node.className = 'msg show ' + kind;
  }

  /* ── Reconnecting with a code ───────────────────────────── */
  function connect() {
    var code = el('code').value.trim();
    var msg = el('rcMsg');
    if (!code) { say(msg, t('code.empty'), 'bad'); return; }

    el('connectBtn').disabled = true;
    msg.className = 'msg';
    waitShow(t('wait.checking'));

    api('POST', '/hotspot/validate/', { code: code, mac_address: MAC, t: TENANT_TOKEN },
      function (data) {
        // Keep the proof. The connected page needs it to be shown the code
        // again, and only a device that has redeemed one gets it.
        if (data && data.device_token) { saveDeviceToken(MAC, data.device_token); }
        waitDone(t('wait.connected'), logIn);
      },
      function (detail) {
        // Back to the page with the reason on it. Leaving the overlay up
        // would hide the box they need to correct.
        waitHide();
        el('connectBtn').disabled = false;
        el('connectBtn').textContent = t('code.connect');
        say(msg, detail || t('code.nomatch'), 'bad');
      });
  }

  el('connectBtn').addEventListener('click', connect);
  el('code').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); connect(); }
  });

  /* ── Packages ───────────────────────────────────────────── */
  function money(v) {
    var n = Number(v);
    return isNaN(n) ? v : n.toLocaleString();
  }

  function renderPackages(list) {
    var host = el('packages');
    host.innerHTML = '';

    if (!list.length) {
      host.innerHTML = '<div class="empty"></div>';
      host.firstChild.textContent = t('packages.none');
      return;
    }

    for (var i = 0; i < list.length; i++) {
      host.appendChild(packageCard(list[i]));
    }
  }

  function packageCard(pkg) {
    var card = document.createElement('div');
    card.className = 'pkg';

    var speed = (pkg.download_speed || '?') + '/' + (pkg.upload_speed || '?') + ' Mbps';
    var meta = speed + ' · ' + (pkg.duration || '');
    if (pkg.monthly_data_cap_gb > 0) { meta += ' · ' + pkg.monthly_data_cap_gb + ' GB'; }

    var main = document.createElement('div');
    main.className = 'pkg-main';
    main.innerHTML =
      '<div class="pkg-text">' +
        '<div class="pkg-name"></div>' +
        '<div class="pkg-meta"></div>' +
      '</div>' +
      '<div class="pkg-price">KES ' + money(pkg.price) + '</div>';

    // Assigned as text, never interpolated: a package name is operator input
    // and this page has no framework escaping it.
    main.querySelector('.pkg-name').textContent = pkg.name || 'Package';
    main.querySelector('.pkg-meta').textContent = meta;

    var buy = document.createElement('button');
    buy.type = 'button';
    buy.className = 'pkg-buy';
    buy.textContent = t('buy');
    main.appendChild(buy);

    var pay = document.createElement('div');
    pay.className = 'pkg-pay';
    pay.innerHTML =
      '<label>' + t('pay.label') + '</label>' +
      '<div class="pay-row">' +
        '<input type="tel" inputmode="numeric" autocomplete="tel" placeholder="07XX XXX XXX" maxlength="15">' +
        '<button type="button">' + t('pay.submit') + '</button>' +
      '</div>' +
      '<p class="pay-note">' + t('pay.note') + '</p>' +
      '<div class="pkg-status"></div>';

    card.appendChild(main);
    card.appendChild(pay);

    var input  = pay.querySelector('input');
    var submit = pay.querySelector('button');
    var status = pay.querySelector('.pkg-status');

    buy.addEventListener('click', function () {
      // One open at a time — two prompts on screen is two chances to type a
      // number into the wrong package.
      var open = document.querySelector('.pkg.open');
      if (open && open !== card) { open.className = 'pkg'; }
      card.className = (card.className.indexOf('open') === -1) ? 'pkg open' : 'pkg';
      if (card.className.indexOf('open') !== -1) { input.focus(); }
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submit.click(); }
    });

    submit.addEventListener('click', function () {
      var phone = input.value.replace(/[^0-9+]/g, '');
      if (phone.replace(/\D/g, '').length < 9) {
        setStatus(status, t('pay.badnumber'), 'bad');
        return;
      }
      buyPackage(pkg, phone, submit, status);
    });

    return card;
  }

  function setStatus(node, text, kind) {
    node.className = 'pkg-status show ' + kind;
    node.innerHTML = '';
    if (kind === 'waiting') {
      var dot = document.createElement('span');
      dot.className = 'dot';
      node.appendChild(dot);
    }
    node.appendChild(document.createTextNode(text));
  }

  function buyPackage(pkg, phone, submit, status) {
    // Only one purchase can be in flight. Starting a second used to leave the
    // first card disabled and stuck on "waiting" for ever, because the poll
    // timer is shared -- so the customer sat watching a package that was no
    // longer being paid for.
    if (active) { active.reset(); }
    active = {
      reset: function () {
        submit.disabled = false;
        status.className = 'pkg-status';
      }
    };

    submit.disabled = true;
    setStatus(status, t('pay.sending'), 'waiting');
    waitShow(t('pay.sending'));

    api('POST', '/hotspot/purchase/', { t: TENANT_TOKEN, package_id: pkg.id, phone: phone },
      function (data) {
        // Out of the way now. What follows is the customer finding their
        // phone and typing a PIN, which takes as long as it takes — and the
        // packages behind this are worth more to them than a spinner.
        waitHide();
        setStatus(status, t('pay.approve'), 'waiting');
        awaitPayment(data && data.reference, data && data.poll_token, submit, status);
      },
      function (detail) {
        waitHide();
        active = null;
        submit.disabled = false;
        setStatus(status, detail || t('pay.failed'), 'bad');
      });
  }

  /* ── Waiting for the money ──────────────────────────────────
     Once it lands we redeem the voucher for this device ourselves. The
     customer has already paid on this phone; making them read a code off
     one screen and type it into another is a step that exists only
     because nothing did it for them. */
  function awaitPayment(reference, pollToken, submit, status) {
    if (!reference) {
      active = null;
      submit.disabled = false;
      setStatus(status, 'The payment did not start. Please try again.', 'bad');
      return;
    }

    var startedAt = Date.now();
    var delay = POLL_MS;

    // The token is what releases the voucher. Without it this endpoint still
    // answers paid or unpaid, so a reload that lost the token recovers to
    // something useful rather than to nothing.
    var url = '/hotspot/payment-status/?t=' + encodeURIComponent(TENANT_TOKEN) +
              '&ref=' + encodeURIComponent(reference) +
              (pollToken ? '&token=' + encodeURIComponent(pollToken) : '');

    if (pollTimer) { clearTimeout(pollTimer); }

    function stop() { clearTimeout(pollTimer); pollTimer = null; active = null; }

    function tick() {
      if (Date.now() - startedAt > GIVE_UP_MS) {
        stop();
        submit.disabled = false;
        setStatus(status, t('pay.expired'), 'bad');
        return;
      }

      api('GET', url, null,
        function (data) {
          delay = POLL_MS;                    // recovered, back to normal pace
          if (!data) { pollTimer = setTimeout(tick, delay); return; }

          if (data.status === 'paid') {
            stop();
            setStatus(status, t('pay.paid'), 'ok');
            // Theirs is done; this next part is ours, and it is the one that
            // takes a second while the router is told about them.
            waitShow(t('wait.connecting'));
            if (data.voucher_code) {
              api('POST', '/hotspot/validate/',
                { code: data.voucher_code, mac_address: MAC, t: TENANT_TOKEN },
                function (ok) {
                  if (ok && ok.device_token) { saveDeviceToken(MAC, ok.device_token); }
                  waitDone(t('wait.connected'), logIn);
                },
                function (detail, code) {
                  // Paid, but binding failed.
                  //
                  // This used to say "enter the code in the box at the top"
                  // whatever went wrong. The box calls this same endpoint with
                  // this same code and this same MAC, so when the refusal was
                  // a device limit it failed identically — a customer who had
                  // just paid was told to retry the one thing that could not
                  // work, and did, and was refused again.
                  //
                  // 409 means the account or the device is the problem and
                  // nothing the customer types will change it. Anything else
                  // is transient, and the box is a fair suggestion.
                  waitHide();
                  if (code === 409) {
                    setStatus(status,
                      (detail || 'This code is already in use on another device.') +
                      ' Your code is ' + data.voucher_code +
                      '. Please show it to the attendant.', 'bad');
                  } else {
                    setStatus(status,
                      'Paid. Enter ' + data.voucher_code + ' in the box at the top.', 'ok');
                  }
                });
            } else {
              waitDone(t('wait.connected'), logIn);
            }
            return;
          }

          if (data.status === 'not_found') {
            stop();
            submit.disabled = false;
            setStatus(status, t('pay.lost'), 'bad');
            return;
          }

          pollTimer = setTimeout(tick, delay);
        },
        function (_detail, code) {
          // 429 means we are asking too often. Slowing down is the only
          // correct response: hammering on would keep the bucket empty for
          // everyone else on this hotspot as well, and they are all behind
          // the same address. Anything else is a transient blip, which a
          // captive portal produces plenty of.
          if (code === 429) { delay = Math.min(delay * 2, 20000); }
          pollTimer = setTimeout(tick, delay);
        });
    }

    pollTimer = setTimeout(tick, delay);
  }

  /* ── Load ───────────────────────────────────────────────── */
  if (!API_BASE || API_BASE.indexOf('your-backend') !== -1) {
    el('pkgEmpty').textContent = 'This portal has not been set up yet.';
    return;
  }

  function renderSupport(numbers) {
    if (!numbers || !numbers.length) { return; }
    var row = el('supportRow');
    row.innerHTML = '';
    for (var i = 0; i < numbers.length; i++) {
      var link = document.createElement('a');
      // tel: strips spaces and punctuation; the label keeps them readable.
      link.href = 'tel:' + String(numbers[i]).replace(/[^0-9+]/g, '');
      var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icon.setAttribute('width', '13');
      icon.setAttribute('height', '13');
      icon.setAttribute('viewBox', '0 0 24 24');
      icon.setAttribute('fill', 'none');
      icon.setAttribute('stroke', 'currentColor');
      icon.setAttribute('stroke-width', '2.2');
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z');
      icon.appendChild(path);
      link.appendChild(icon);
      var label = document.createElement('span');
      // As text: an operator types these, and this page has no escaping.
      label.textContent = numbers[i];
      link.appendChild(label);
      row.appendChild(link);
    }
    el('support').hidden = false;
  }

  api('GET', '/hotspot/packages/?t=' + encodeURIComponent(TENANT_TOKEN), null,
    function (data) {
      if (data && data.provider) {
        el('provider').textContent = data.provider;
        document.title = data.provider;
      }
      renderPackages((data && data.results) || []);
      if (data && data.terms_url) {
        var link = el('termsLink');
        link.href = data.terms_url;
        el('terms').hidden = false;
      }
      // Older backends send one number under the old key.
      renderSupport((data && data.support_phones) ||
                    (data && data.support_phone ? [data.support_phone] : []));
    },
    function () {
      // "Pull down to refresh" is advice a captive-portal webview often
      // cannot take. Give them something to press.
      var box = el('pkgEmpty');
      if (!box) { return; }
      box.textContent = t('packages.failed');
      var again = document.createElement('button');
      again.type = 'button';
      again.className = 'pkg-buy';
      again.textContent = t('packages.retry');
      again.addEventListener('click', function () { window.location.reload(); });
      box.appendChild(again);
    });

  initLanguage();
  el('code').focus();
})();
</script>

</body>
</html>
