version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wifi_billing
      POSTGRES_USER: wifi_user
      POSTGRES_PASSWORD: wifi_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    # gunicorn, not `manage.py runserver` — runserver is single-threaded, does
    # not serve static under DEBUG=False, and is explicitly not for production.
    # collectstatic runs first so WhiteNoise has something to serve (/admin/).
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             exec gunicorn backend.wsgi:application
             --bind 0.0.0.0:8000
             --workers ${GUNICORN_WORKERS:-4}
             --timeout 60
             --access-logfile -
             --error-logfile -"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A backend worker -l info
    env_file:
      - .env
    depends_on:
      - web
      - redis
      - postgres

  beat:
    build: .
    command: celery -A backend beat -l info
    env_file:
      - .env
    depends_on:
      - web
      - redis
      - postgres

  flower:
    build: .
    # Credentials come from FLOWER_BASIC_AUTH in .env — never hardcode them here,
    # this file is committed. The `:?` guard makes compose abort with the message
    # below if the variable is unset or empty; without it an empty --basic_auth
    # would start Flower with NO authentication at all, silently exposing every
    # task payload (phone numbers, M-Pesa references) on port 5555.
    command: >
      celery -A backend flower
      --address=0.0.0.0
      --port=5555
      --basic_auth=${FLOWER_BASIC_AUTH:?set FLOWER_BASIC_AUTH=user:password in backend/.env}
    env_file:
      - .env
    # Bound to loopback: Flower has no TLS and only weak basic auth, so it should
    # not be reachable from outside the host. Reach it via an SSH tunnel:
    #   ssh -L 5555:localhost:5555 you@server
    # Change to "5555:5555" only if you front it with a TLS-terminating proxy.
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
      - worker

volumes:
  pgdata:
